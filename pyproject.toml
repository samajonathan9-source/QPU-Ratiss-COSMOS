[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qpu-ratiss-cosmos"
version = "0.1.0"
description = "Reproducible local Qiskit Aer and RATISS experiment harness."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "qiskit==2.5.2", "qiskit-aer==0.17.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
